[project]
name = "estudia"
version = "0.1.0"
description = "Herramienta local de estudio para estudiantes universitarios"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "google-genai",
    "sympy",
    "keyring",
    "platformdirs",
    "pydantic",
    "tzdata",
    "yt-dlp[default,deno]>=2026.8.19",
]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[dependency-groups]
dev = ["pytest", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estudia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Avisos de dependencias, ajenos al código de Estudia.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai",
]
